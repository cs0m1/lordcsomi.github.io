<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="10" dy="14" stdDeviation="18" flood-color="#252627" flood-opacity="0.16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#252627"/>
    </marker>
    <style>
      .ink   { stroke:#252627; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .thin  { stroke:#6B6B6B; stroke-width:1.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .seg   { stroke:#252627; stroke-width:9; fill:none; stroke-linecap:round; }
      .segoff{ stroke:#252627; stroke-width:9; fill:none; stroke-linecap:round; opacity:.10; }
      .fillsoft { fill:#252627; opacity:.05; }
      .dot   { fill:#252627; }
    </style>
  </defs>

  <rect width="1376" height="768" fill="#FDFBF1"/>

  <g filter="url(#soft)">
    <rect x="300" y="150" width="776" height="470" fill="#FDFBF1" stroke="#252627" stroke-width="1.7"/>
  </g>

  <!-- the readout. It says ten. It will say ten again. -->
  <g>
    <rect class="fillsoft" x="812" y="196" width="216" height="140"/>
    <rect class="ink"      x="812" y="196" width="216" height="140"/>

    <!-- digit 1 -->
    <g transform="translate(858 226)">
      <line class="segoff" x1="0"  y1="0"  x2="34" y2="0"/>
      <line class="seg"    x1="34" y1="0"  x2="34" y2="38"/>
      <line class="seg"    x1="34" y1="42" x2="34" y2="80"/>
      <line class="segoff" x1="0"  y1="80" x2="34" y2="80"/>
      <line class="segoff" x1="0"  y1="42" x2="0"  y2="80"/>
      <line class="segoff" x1="0"  y1="0"  x2="0"  y2="38"/>
      <line class="segoff" x1="0"  y1="40" x2="34" y2="40"/>
    </g>
    <!-- digit 0 -->
    <g transform="translate(936 226)">
      <line class="seg"    x1="0"  y1="0"  x2="34" y2="0"/>
      <line class="seg"    x1="34" y1="0"  x2="34" y2="38"/>
      <line class="seg"    x1="34" y1="42" x2="34" y2="80"/>
      <line class="seg"    x1="0"  y1="80" x2="34" y2="80"/>
      <line class="seg"    x1="0"  y1="42" x2="0"  y2="80"/>
      <line class="seg"    x1="0"  y1="0"  x2="0"  y2="38"/>
      <line class="segoff" x1="0"  y1="40" x2="34" y2="40"/>
    </g>
  </g>

  <!-- reaching zero does not win. It rebuilds and starts again. -->
  <g>
    <path class="ink" marker-end="url(#arrow)"
          d="M 800 266 C 740 200, 640 196, 590 236"/>
    <path class="thin" d="M 596 214 l -10 26 l 26 4" />
  </g>

  <!-- the button -->
  <g>
    <circle class="thin" cx="560" cy="420" r="134"/>
    <circle class="ink"  cx="560" cy="420" r="120"/>
    <circle class="fillsoft" cx="560" cy="420" r="120"/>
    <circle class="thin" cx="560" cy="420" r="100"/>
    <path class="thin" d="M 488 348 A 100 100 0 0 1 632 348"/>
    <line class="ink" x1="520" y1="420" x2="600" y2="420" stroke-width="3"/>
  </g>

  <!-- your cursor. The game treats it as a body. -->
  <g transform="translate(614 466)">
    <path class="ink" d="M 0 0 L 0 42 L 11 32 L 19 50 L 27 46 L 19 29 L 33 27 Z" fill="#FDFBF1"/>
  </g>

  <!-- ten presses, and the last one is the one that costs you -->
  <g transform="translate(392 566)">
    <g class="thin">
      <line x1="0" y1="0" x2="592" y2="0"/>
    </g>
    <g>
      <rect class="ink" x="0"   y="-9" width="18" height="18"/>
      <rect class="ink" x="64"  y="-9" width="18" height="18"/>
      <rect class="ink" x="128" y="-9" width="18" height="18"/>
      <rect class="ink" x="192" y="-9" width="18" height="18"/>
      <rect class="ink" x="256" y="-9" width="18" height="18"/>
      <rect class="ink" x="320" y="-9" width="18" height="18"/>
      <rect class="ink" x="384" y="-9" width="18" height="18"/>
      <rect class="ink" x="448" y="-9" width="18" height="18"/>
      <rect class="ink" x="512" y="-9" width="18" height="18"/>
      <rect class="ink" x="574" y="-11" width="22" height="22" stroke-dasharray="4 3"/>
    </g>
  </g>

  <rect width="1376" height="768" filter="url(#grain)" opacity="0.035"/>
</svg>
